<!doctype html>
<!--
  Beacon · 机器坞 (Machine Dock) · 交互原型 v1
  ----------------------------------------------------------------------------
  这是「讨论用」的高保真原型，不改 app 代码。

  要验证的交互主张：
  1. 机器不再是侧栏里的分组标题，而是侧栏底部的一排头像（可横向滚动）。
  2. 点头像 = 整个工作区切换：左侧会话、上方标签、终端、底部机器身份一起换。
  3. 标签栏只属于当前机器，所以标签上不再需要机器名 pill。
  4. 底部 success / pending / fail 计数保留，并且是「全舰队」口径：
     点一个计数，会跨机器跳到下一条对应状态的会话。
  5. 侧栏收起的沉浸模式下，机器坞浮到窗口底部中间，机器切换不丢失。

  视觉 token 取自 internal/uitokens（Kero v2 的浅色默认 + rex wash）。
  数据是 mock，用来覆盖：在线/离线、空机器、等待你、失败、运行中、已完成、
  标签未打开、9 台机器溢出。
-->

<style>

.legend .work { background: #6b93ff; }
.legend .done { background: #8e8e99; }
.legend .err { background: #ff6961; }

/* ==========================================================================
   app window + theme tokens

  --danger-border: rgba(217,58,53,.22);
  --success: #22863a;

.window[data-theme="dark"] {

  --shadow-1: 0 1px 2px rgba(0,0,0,.2);
  --term-path: #4fd17a;
  --term-branch: #f0a33a;
  --term-ok: #4fd17a;
  --term-err: #ff6961;
  --term-warn: #f0a33a;
  --term-agent: #6b93ff;
  --wash-0: #17141f;

.window[data-theme="dark"] .avatar {
  background: hsl(var(--h) 26% 30%);
  color: hsl(var(--h) 40% 88%);

/* traffic lights */
.window-lights {
  position: absolute;
  left: 18px;
  top: 21px;
  z-index: 30;
  display: flex;
  gap: 8px;
  pointer-events: none;
}
.light {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  box-shadow: inset 0 0 0 .5px rgba(0,0,0,.18);
}
.light.close { background: #ff5f57; }
.light.min { background: #febc2e; }
.light.max { background: #28c840; }

/* ==========================================================================
   sidebar
   ========================================================================== */
.sidebar {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  z-index: 4;
  width: 268px;
  display: flex;
  flex-direction: column;
  transition: transform .30s cubic-bezier(.25,1,.5,1), opacity .22s ease;
}
.window.focus .sidebar {
  transform: translateX(-100%);
  opacity: 0;
  pointer-events: none;
}
.side-top {
  flex: none;
  height: 60px;
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 0 9px 0 84px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
  font-size: 13.5px;
  font-weight: 600;
  letter-spacing: -.01em;
  white-space: nowrap;
}
.brand-dot {
  width: 7px;
  height: 7px;
  flex: none;
  border-radius: 50%;
  background: var(--success);
  box-shadow: 0 0 0 3px var(--success-soft);
}
.top-actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 1px;
}
.icon-btn {
  width: 26px;
  height: 26px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 7px;
  color: var(--muted);
}
.icon-btn:hover { background: var(--hover); color: var(--ink); }
.icon-btn.tiny { width: 22px; height: 22px; }
.icon-btn svg { width: 14px; height: 14px; }

.side-head {
  flex: none;
  height: 28px;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 12px;
}
.side-title {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: .01em;
}
.side-count {
  padding: 1px 5px;
  border-radius: 999px;
  background: var(--chip);
  color: var(--faint);
  font-size: 10px;
  font-variant-numeric: tabular-nums;
}
.spacer { flex: 1; }

.filter-bar { flex: none; padding: 0 10px 6px; }
.filter-bar input {
  width: 100%;
  height: 26px;
  padding: 0 8px;
  border: 1px solid var(--card-border);
  border-radius: 7px;
  outline: none;
  background: var(--field);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 11.5px;
}
.filter-bar input::placeholder { color: var(--faint); }
.filter-bar input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.sessions {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 2px 10px 8px;
  scrollbar-width: thin;
  scrollbar-color: var(--faint) transparent;
}
.sessions::-webkit-scrollbar { width: 7px; }
.sessions::-webkit-scrollbar-thumb {
  border: 2px solid transparent;
  border-radius: 8px;
  background: var(--faint);
  background-clip: padding-box;
}
.row {
  width: 100%;
  height: 34px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 8px;
  border-radius: 8px;
  text-align: left;
  color: var(--ink);
}
.row:hover { background: var(--hover); }
.row.active {
  background: var(--selected);
  box-shadow: 0 1px 2px var(--row-shadow);
}
.row .glyph {
  width: 14px;
  height: 14px;
  flex: none;
  display: grid;
  place-items: center;
}
.row .glyph svg { width: 14px; height: 14px; }
.row .title {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 13px;
  letter-spacing: -.004em;
}
.row .meta {
  flex: none;
  color: var(--faint);
  font-size: 10.5px;
  font-variant-numeric: tabular-nums;
}
.row.waiting .meta { color: var(--attention); }
.row.error .meta { color: var(--danger); }
.st-waiting { color: var(--attention); }
.st-working { color: var(--accent); }
.st-error { color: var(--danger); }
.st-done { color: var(--muted); }
.st-idle { color: var(--faint); }
.spin { animation: spin 1s linear infinite; transform-origin: center; }
@keyframes spin { to { transform: rotate(360deg); } }

.sessions-empty {
  padding: 24px 12px;
  color: var(--faint);
  font-size: 11.5px;
  line-height: 1.7;
  text-align: center;
}
.sessions-empty b {
  display: block;
  margin-bottom: 2px;
  color: var(--muted);
  font-weight: 550;
}

/* sidebar foot */
.side-foot {
  flex: none;
  padding: 8px 10px 10px;
  border-top: 1px solid var(--divider);
}
.fleet-stats {
  height: 22px;
  display: flex;
  align-items: center;
  gap: 1px;
}
.fstat {
  height: 20px;
  padding: 0 4px;
  display: flex;
  align-items: center;
  gap: 4px;
  border-radius: 5px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.fstat:hover { background: var(--hover); }
.fstat .fdot {
  width: 5px;
  height: 5px;
  flex: none;
  border-radius: 50%;
  background: var(--faint);
}
.fstat b {
  color: var(--ink);
  font-size: 11px;
  font-weight: 650;
}
.fstat span {
  color: var(--faint);
  font-size: 9px;
  letter-spacing: .01em;
}
.fstat.waiting .fdot { background: var(--attention); }
.fstat.waiting b { color: var(--attention); }
.fstat.working .fdot { background: var(--accent); }
.fstat.working b { color: var(--accent); }
.fstat.done .fdot { background: var(--success); }
.fstat.done b { color: var(--muted); }
.fstat.error .fdot { background: var(--danger); }
.fstat.error b { color: var(--danger); }
.fstat.zero { opacity: .42; }
.fleet-scope {
  margin-left: auto;
  padding-right: 1px;
  color: var(--faint);
  font-size: 8px;
  letter-spacing: .05em;
  white-space: nowrap;
}

.machine-line {
  height: 18px;
  margin-top: 3px;
  display: flex;
  align-items: center;
  gap: 6px;
  overflow: hidden;
  color: var(--faint);
  font-size: 10.5px;
  white-space: nowrap;
}
.online-dot {
  width: 6px;
  height: 6px;
  flex: none;
  border-radius: 50%;
  background: var(--success);
  box-shadow: 0 0 0 2.5px var(--success-soft);
}
.online-dot.off {
  background: var(--faint);
  box-shadow: 0 0 0 2.5px var(--chip);
}
.machine-line .name {
  min-width: 0;
  max-width: 132px;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--ink);
  font-size: 11.5px;
  font-weight: 550;
  letter-spacing: -.004em;
}
.machine-line .count {
  color: var(--faint);
  font-size: 10px;
}
.machine-line kbd {
  margin-left: auto;
  padding: 0 4px;
  border: 1px solid var(--kbd-border);
  border-radius: 4px;
  background: var(--kbd);
  color: var(--faint);
  font-family: var(--font-ui);
  font-size: 9px;
}

/* machine dock */
.dock-wrap {
  position: relative;
  display: flex;
  align-items: center;
  gap: 5px;
  margin-top: 5px;
}
.dock {
  position: relative;
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 7px;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 5px 4px 9px;
  scrollbar-width: none;
}
.dock::-webkit-scrollbar { display: none; }
.dock-wrap.overflow .dock {
  mask-image: linear-gradient(90deg, transparent 0, #000 11px, #000 calc(100% - 14px), transparent 100%);
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 11px, #000 calc(100% - 14px), transparent 100%);
}
.avatar {
  position: relative;
  flex: none;
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  border: 1px solid var(--avatar-border);
  border-radius: 11px;
  background: hsl(var(--h) 46% 90%);
  color: hsl(var(--h) 36% 32%);
  font-size: 12px;
  font-weight: 650;
  letter-spacing: .01em;
  opacity: .84;
  box-shadow: 0 1px 2px rgba(0,0,0,.06);
  transition: transform .16s ease, box-shadow .16s ease, opacity .16s ease;
}
.avatar:hover {
  opacity: 1;
  transform: translateY(-1px);
  box-shadow: 0 2px 5px rgba(0,0,0,.12);
}
.avatar.active {
  opacity: 1;
  transform: translateY(-1px);
  box-shadow: 0 2px 7px rgba(0,0,0,.14);
}
.avatar.active::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -7px;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--ink);
  transform: translateX(-50%);
}
.avatar.offline { filter: grayscale(1); opacity: .42; }
.avatar.offline:hover { opacity: .72; }
.avatar .badge {
  position: absolute;
  top: -4px;
  right: -4px;
  min-width: 15px;
  height: 15px;
  padding: 0 4px;
  border-radius: 999px;
  color: #fff;
  font-size: 9px;
  font-weight: 700;
  line-height: 15px;
  text-align: center;
  box-shadow: 0 0 0 1.5px var(--badge-ring);
}
.avatar .badge.warn { background: var(--attention); }
.avatar .badge.bad { background: var(--danger); }
.avatar .work-dot {
  position: absolute;
  right: -1px;
  bottom: -1px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 2px var(--badge-ring);
}

  height: 28px;

  place-items: center;

/* ==========================================================================
   main card
   ========================================================================== */
.main {
  position: absolute;
  left: 276px;
  top: 8px;
  right: 8px;
  bottom: 8px;
  z-index: 2;
  transition:
    left .30s cubic-bezier(.25,1,.5,1),
    bottom .30s cubic-bezier(.25,1,.5,1);
}
.window.focus .main { left: 8px; bottom: 86px; }
.card {
  position: relative;
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border: 1px solid var(--card-border);
  border-radius: 14px;
  background: var(--card);
  box-shadow: var(--shadow-card);
}
.card.swap { animation: swapIn .20s cubic-bezier(.22,1,.36,1); }
@keyframes swapIn {
  from { opacity: .45; transform: translateY(3px); }
  to { opacity: 1; transform: none; }
}
.tabstrip {
  flex: none;
  height: 44px;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 10px 0 14px;
  border-bottom: 1px solid var(--card-border);
  background: var(--tabstrip);
}
.window.focus .tabstrip { padding-left: 86px; }
.focus-toggle { display: none; }
.window.focus .focus-toggle { display: grid; }
.tabs {
  flex: 1;
  min-width: 0;
  height: 100%;
  display: flex;
  align-items: center;
  gap: 4px;
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: none;
  max-width: 220px;
  height: 30px;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 8px 0 9px;
  border: 1px solid transparent;
  border-radius: 8px;
  color: var(--muted);
  cursor: pointer;
}
.tab:hover { background: var(--hover); color: var(--ink); }
.tab.active {
  border-color: var(--tab-border);
  background: var(--tab-active);
  color: var(--ink);
  box-shadow: var(--tab-shadow);
}
.tab-glyph {
  width: 13px;
  height: 13px;
  flex: none;
  display: grid;
  place-items: center;
}
.tab-glyph svg { width: 13px; height: 13px; }
.tab-title {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 12px;
  letter-spacing: -.003em;
}
.tab-close {
  width: 16px;
  height: 16px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 5px;
  color: var(--faint);
  opacity: 0;
}
.tab:hover .tab-close, .tab.active .tab-close { opacity: 1; }
.tab-close:hover { background: var(--hover); color: var(--ink); }
.tab-close svg { width: 11px; height: 11px; }
.tabs-empty {
  padding-left: 2px;
  color: var(--faint);
  font-size: 11px;
}
.tab-end { flex: none; display: flex; align-items: center; gap: 1px; }

.banner {
  flex: none;
  min-height: 34px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 14px;
  border-bottom: 1px solid var(--danger-border);
  background: var(--danger-soft);
  color: var(--danger);
  font-size: 11.5px;
}
.banner b { font-weight: 600; }
.banner .banner-btn {
  margin-left: auto;
  height: 22px;
  padding: 0 8px;
  border: 1px solid var(--danger-border);
  border-radius: 6px;
  color: var(--danger);
  font-size: 10px;
}
.banner .banner-btn:hover { background: rgba(217,58,53,.10); }

.pane {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 16px 20px 22px;
  background: var(--card);
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 12.5px;
  line-height: 1.62;
  scrollbar-width: thin;
  scrollbar-color: var(--faint) transparent;
}
.pane::-webkit-scrollbar { width: 8px; }
.pane::-webkit-scrollbar-thumb {
  border: 2px solid transparent;
  border-radius: 8px;
  background: var(--faint);
  background-clip: padding-box;
}
.tline {
  min-height: 18px;
  white-space: pre-wrap;
  word-break: break-word;
}
.tp-tilde { color: var(--term-path); }
.tp-path { color: var(--term-path); }
.tp-branch { color: var(--term-branch); }
.tp-dollar { color: var(--faint); }
.tp-cmd { color: var(--ink); }
.tline.dim { color: var(--faint); }
.tline.ok { color: var(--term-ok); }
.tline.err { color: var(--term-err); }
.tline.warn { color: var(--term-warn); }
.tline.agent { color: var(--term-agent); }
.tline.spin {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--muted);
}
.mini-spin {
  width: 10px;
  height: 10px;
  flex: none;
  border: 1.5px solid var(--divider);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
.perm {
  max-width: 680px;
  margin: 9px 0 11px;
  padding: 9px 12px;
  border: 1px solid var(--attn-border);
  border-radius: 9px;
  background: var(--attn-soft);
}
.perm-title {
  margin-bottom: 5px;
  color: var(--attention);
  font-family: var(--font-ui);
  font-size: 11.5px;
  font-weight: 600;
}
.perm-body {
  color: var(--ink);
  font-size: 11.5px;
  line-height: 1.6;
  white-space: pre-wrap;
}
.perm-opts {
  display: flex;
  flex-direction: column;
  gap: 3px;
  margin-top: 8px;
}
.perm-opt {
  color: var(--muted);
  font-size: 11.5px;
}
.perm-opt kbd {
  display: inline-block;
  min-width: 14px;
  padding: 0 3px;
  border: 1px solid var(--kbd-border);
  border-radius: 3px;
  background: var(--kbd);
  color: var(--faint);
  font-family: var(--font-ui);
  font-size: 9px;
  text-align: center;
}
.cursor {
  display: inline-block;
  width: 7px;
  height: 15px;
  vertical-align: -2px;
  background: var(--ink);
  opacity: .8;
  animation: blink 1.1s steps(2, start) infinite;
}
@keyframes blink { 50% { opacity: 0; } }

.pane-empty {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 24px;
  color: var(--faint);
  font-family: var(--font-ui);
  text-align: center;
}
.empty-icon {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  margin-bottom: 2px;
  border: 1px solid var(--card-border);
  border-radius: 13px;
  background: var(--field);
  color: var(--muted);
}
.empty-icon svg { width: 22px; height: 22px; }
.pane-empty h2 {
  margin: 0;
  color: var(--ink);
  font-size: 13.5px;
  font-weight: 600;
  letter-spacing: -.01em;
}
.pane-empty p {
  max-width: 360px;
  margin: 0;
  font-size: 11.5px;
  line-height: 1.65;
}
.empty-actions { display: flex; gap: 6px; margin-top: 6px; }
.empty-btn {
  height: 27px;
  padding: 0 10px;
  border: 1px solid var(--card-border);
  border-radius: 7px;
  background: var(--field);
  color: var(--ink);
  font-size: 11px;
}
.empty-btn:hover { background: var(--hover); }
.empty-btn.primary {
  border-color: transparent;
  background: var(--accent);
  color: #fff;
}
.empty-btn.primary:hover { filter: brightness(1.05); }

.composer {
  flex: none;
  height: 48px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 12px;
  border-top: 1px solid var(--divider);
  background: var(--card);
}
.composer .prompt {
  color: var(--accent);
  font-family: var(--font-mono);
  font-size: 13px;
}
.composer input {
  flex: 1;
  min-width: 0;
  height: 30px;
  padding: 0 9px;
  border: 1px solid var(--card-border);
  border-radius: 7px;
  outline: none;
  background: var(--field);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 11.5px;
}
.composer input::placeholder { color: var(--faint); }
.composer input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.composer input:disabled { opacity: .55; }
.send {
  height: 26px;
  padding: 0 9px;
  display: flex;
  align-items: center;
  gap: 4px;
  border-radius: 7px;
  background: var(--accent);
  color: #fff;
  font-size: 10.5px;
  font-weight: 550;
}
.send:disabled { opacity: .35; }
.keys {
  flex: none;
  height: 30px;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 0 12px;
  border-top: 1px solid var(--divider);
  overflow: hidden;
}
.keys.disabled { opacity: .42; pointer-events: none; }
.key {
  height: 19px;
  min-width: 20px;
  padding: 0 5px;
  display: grid;
  place-items: center;
  border: 1px solid var(--kbd-border);
  border-radius: 5px;
  background: var(--kbd);
  color: var(--muted);
  font-family: var(--font-ui);
  font-size: 9.5px;
}
.key:hover { color: var(--ink); }
.key.on {
  border-color: var(--accent-border);
  background: var(--accent-soft);
  color: var(--accent);
}
.ksep { width: 1px; height: 12px; margin: 0 2px; background: var(--divider); }

/* ==========================================================================
   focus-mode floating dock
   ========================================================================== */
.focus-dock {
  position: absolute;
  left: 50%;
  bottom: 12px;
  z-index: 20;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  transform: translateX(-50%) translateY(7px);
  opacity: 0;
  pointer-events: none;
  transition: opacity .20s ease, transform .28s cubic-bezier(.25,1,.5,1);
}
.window.focus .focus-dock {
  opacity: 1;
  pointer-events: auto;
  transform: translateX(-50%) translateY(0);
}
.fd-caption {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 3px 9px;
  border: 1px solid var(--card-border);
  border-radius: 7px;
  background: var(--glass);
  color: var(--muted);
  font-size: 10.5px;
  box-shadow: var(--shadow-1);
  backdrop-filter: blur(14px) saturate(1.15);
  -webkit-backdrop-filter: blur(14px) saturate(1.15);
  white-space: nowrap;
}
.fd-caption b { color: var(--ink); font-size: 11px; font-weight: 550; }
.fd-caption .wait { color: var(--attention); font-weight: 550; }
.fd-caption .bad { color: var(--danger); font-weight: 550; }
.fd-bar {
  max-width: 900px;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 6px 7px;
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  background: var(--glass);
  box-shadow: var(--shadow-pop);
  backdrop-filter: blur(22px) saturate(1.2);
  -webkit-backdrop-filter: blur(22px) saturate(1.2);
}
.fd-fleet {
  padding-left: 2px;
  color: var(--faint);
  font-size: 9px;
  letter-spacing: .05em;
  white-space: nowrap;
}
.fd-stats { display: flex; align-items: center; gap: 1px; }
.fd-stat {
  height: 26px;
  min-width: 29px;
  padding: 0 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  border-radius: 7px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.fd-stat:hover { background: var(--hover); }
.fd-stat .ico { width: 11px; height: 11px; display: grid; place-items: center; }
.fd-stat .ico svg { width: 11px; height: 11px; }
.fd-stat .num { font-size: 11px; font-weight: 600; }
.fd-stat.waiting { color: var(--attention); }
.fd-stat.error { color: var(--danger); }
.fd-stat.zero { opacity: .42; }
.fd-sep { width: 1px; height: 20px; flex: none; margin: 0 2px; background: var(--divider); }
.fd-avatars {
  display: flex;
  align-items: center;
  gap: 6px;
  max-width: 620px;
  overflow-x: auto;
  padding: 5px 3px 9px;
  scrollbar-width: none;
}
.fd-avatars::-webkit-scrollbar { display: none; }
.fd-avatars .avatar {
  width: 32px;
  height: 32px;
  border-radius: 10px;
  font-size: 11px;
}
.fd-avatars .avatar .badge {
  top: -3px;
  right: -3px;
  min-width: 13px;
  height: 13px;
  padding: 0 3px;
  font-size: 8px;
  line-height: 13px;
}
.fd-add {
  width: 28px;
  height: 28px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 8px;
  color: var(--faint);
}
.fd-add:hover { color: var(--ink); border-color: var(--muted); background: var(--hover); }
.fd-add svg { width: 11px; height: 11px; }

/* ==========================================================================
   popover, toast, tooltip
   ========================================================================== */
.popover {
  position: absolute;
  z-index: 60;
  width: 216px;
  padding: 10px;
  border: 1px solid var(--card-border);
  border-radius: 11px;
  background: var(--popover);
  box-shadow: var(--shadow-pop);
}
.popover.pop-settings {
  top: 98px;
  right: 10px;
  left: auto;
}
.popover.pop-add {
  bottom: 118px;
  left: 10px;
  right: auto;
}
.pop-head {
  margin-bottom: 8px;
  color: var(--ink);
  font-size: 11px;
  font-weight: 600;
}
.pop-note {
  margin: 0 0 8px;
  color: var(--faint);
  font-size: 10px;
  line-height: 1.55;
}
.pop-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 6px;
  color: var(--muted);
  font-size: 10.5px;
}
.mini-seg {
  display: flex;
  gap: 1px;
  padding: 1px;
  border-radius: 6px;
  background: var(--field);
}
.mini-seg button {
  height: 20px;
  padding: 0 6px;
  border-radius: 5px;
  color: var(--muted);
  font-size: 9.5px;
}
.mini-seg button.on {
  background: var(--tab-active);
  color: var(--ink);
  box-shadow: 0 1px 2px rgba(0,0,0,.08);
}
.pop-input {
  width: 100%;
  height: 27px;
  margin-bottom: 7px;
  padding: 0 7px;
  border: 1px solid var(--card-border);
  border-radius: 6px;
  outline: none;
  background: var(--field);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 11px;
}
.pop-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.pop-primary {
  width: 100%;
  height: 27px;
  border-radius: 6px;
  background: var(--accent);
  color: #fff;
  font-size: 10.5px;
  font-weight: 550;
}
.pop-action {
  width: 100%;
  height: 26px;
  margin-top: 4px;
  border: 1px solid var(--card-border);
  border-radius: 6px;
  color: var(--muted);
  font-size: 10px;
}
.pop-action:hover { background: var(--hover); color: var(--ink); }

.toast {
  position: absolute;
  left: 50%;
  top: 54px;
  z-index: 70;
  padding: 7px 11px;
  border-radius: 8px;
  background: #1c1c21;
  color: #f2f2f5;
  font-size: 11px;
  white-space: nowrap;
  box-shadow: 0 10px 28px rgba(0,0,0,.32);
  opacity: 0;
  pointer-events: none;
  transform: translateX(-50%) translateY(-5px);
  transition: opacity .18s ease, transform .18s ease;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.tip {
  position: fixed;
  z-index: 500;
  max-width: 260px;
  padding: 7px 9px;
  border: 1px solid rgba(255,255,255,.10);
  border-radius: 8px;
  background: #1c1c21;
  color: #f2f2f5;
  box-shadow: 0 10px 28px rgba(0,0,0,.38);
  pointer-events: none;
  opacity: 0;
  transition: opacity .12s ease;
}
.tip.show { opacity: 1; }
.tip-title { font-size: 11.5px; font-weight: 600; }
.tip-meta {
  margin-top: 2px;
  color: #a9a9b4;
  font-size: 10.5px;
  line-height: 1.45;
  white-space: pre-line;
}
.tip-kbd {
  margin-top: 4px;
  color: #d4d4dc;
  font-size: 9.5px;
}

/* ==========================================================================
   responsive
   ========================================================================== */
@media (max-width: 1180px) {
  .canvas-title h1 span { display: none; }
  .canvas { padding: 16px 18px 10px; }
}
@media (max-width: 900px) {
  .canvas-head { align-items: flex-start; flex-direction: column; gap: 10px; }
  .canvas-controls { justify-content: flex-start; }
  .canvas-foot { gap: 8px; font-size: 10px; }
  .canvas-foot .legend { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
}
</style>
</head>
<body>
<div class="canvas">
  <header class="canvas-head">
    <div class="canvas-title">
      <div class="eyebrow">term-fleet / sidebar refactor</div>
      <h1>机器坞 <span>一台机器 = 一个头像 = 一个工作区</span></h1>
    </div>
    <div class="canvas-controls" aria-label="原型控制">
      <div class="seg" data-seg="theme">
        <button type="button" data-set-theme="light" class="on">浅色</button>
        <button type="button" data-set-theme="dark">深色</button>
      </div>
      <div class="seg" data-seg="layout">
        <button type="button" data-set-layout="sidebar" class="on">侧栏</button>
        <button type="button" data-set-layout="focus">沉浸</button>
      </div>
      <button type="button" class="ghost" id="resetBtn">重置演示</button>
    </div>
  </header>

  <div class="stage">
    <div class="window-scaler" id="scaler">
      <div class="window" id="win" data-theme="light" data-screen-label="机器坞 · 侧栏">
        <div class="window-lights" aria-hidden="true">
          <span class="light close"></span>
          <span class="light min"></span>
          <span class="light max"></span>
        </div>

        <aside class="sidebar" id="sidebar" aria-label="会话与机器">
          <div class="side-top">
            <div class="brand"><span class="brand-dot" aria-hidden="true"></span><span>Beacon</span></div>
            <div class="top-actions">
              <button type="button" class="icon-btn" id="newBtn" data-icon="plus" aria-label="新建终端" data-tip-title="新建终端" data-tip-kbd="⌘T"></button>
              <button type="button" class="icon-btn" id="refreshBtn" data-icon="refresh" aria-label="刷新机器与会话" data-tip-title="刷新机器与会话"></button>
              <button type="button" class="icon-btn" id="collapseBtn" data-icon="sidebar" aria-label="收起侧栏" data-tip-title="收起侧栏" data-tip-kbd="⌘B"></button>
            </div>
          </div>

          <div class="side-head">
            <span class="side-title">会话</span>
            <span class="side-count" id="sessCount">0</span>
            <span class="spacer"></span>
            <button type="button" class="icon-btn tiny" id="filterBtn" data-icon="search" aria-label="筛选会话" data-tip-title="筛选会话"></button>
            <button type="button" class="icon-btn tiny" id="settingsBtn" data-icon="sliders" aria-label="外观与侧栏设置" data-tip-title="外观与侧栏"></button>
          </div>

          <div class="filter-bar" id="filterBar" hidden>
            <input id="filterInput" type="search" placeholder="筛选这台机器的会话…" autocomplete="off" spellcheck="false">
          </div>

          <div class="sessions" id="sessions" role="listbox" aria-label="当前机器的会话"></div>

          <div class="side-foot">
            <div class="fleet-stats" id="stats" aria-label="全舰队状态计数"></div>

            <div class="machine-line" id="machineLine"></div>

            <div class="dock-wrap" id="dockWrap">
              <div class="dock" id="dock" role="toolbar" aria-label="机器，左右方向键浏览"></div>
              <button type="button" class="dock-add" id="addMachineBtn" data-icon="plus" aria-label="添加机器" data-tip-title="添加机器"></button>
            </div>
          </div>
        </aside>

        <main class="main">
          <section class="card" id="card" aria-label="当前机器的工作区">
            <div class="tabstrip">
              <button type="button" class="icon-btn focus-toggle" id="focusToggle" data-icon="sidebar" aria-label="展开侧栏" data-tip-title="展开侧栏" data-tip-kbd="⌘B"></button>
              <div class="tabs" id="tabs" role="tablist" aria-label="当前机器的标签"></div>
              <div class="tab-end">
                <button type="button" class="icon-btn" id="newTabBtn" data-icon="plus" aria-label="新建终端" data-tip-title="新建终端" data-tip-kbd="⌘T"></button>
              </div>
            </div>

            <div class="banner" id="banner" hidden></div>
            <div class="pane" id="pane"></div>

            <div class="composer">
              <span class="prompt" aria-hidden="true">❯</span>
              <input id="composerInput" type="text" placeholder="输入命令，回车发送（原型会把它写进画面）" autocomplete="off" spellcheck="false">
              <button type="button" class="send" id="sendBtn">发送 <span aria-hidden="true">↵</span></button>
            </div>

            <div class="keys" id="keys" aria-label="快捷键条">
              <button type="button" class="key" data-key="Esc">Esc</button>

        case 'out': return `<div class="tline">${esc(line.text)}</div>`;
        case 'dim': return `<div class="tline dim">${esc(line.text)}</div>`;

        <h2>这台机器还没有会话</h2>
        <p>在 ${esc(m.name)} 上新建一个终端，它会成为这个工作区的第一个标签。</p>
        <div class="empty-actions"><button type="button" class="empty-btn primary" data-newtab>新建终端</button></div>
      </div>`;
    }
    return `<div class="pane-empty">
      <div class="empty-icon">${ICON.tab}</div>
      <h2>没有打开的标签</h2>
      <p>从左侧选择一个会话，或新建终端。关闭标签不会结束机器上的进程。</p>
      <div class="empty-actions">
        <button type="button" class="empty-btn" data-opensession="${esc(m.sessions[0].id)}">打开最近的会话</button>
        <button type="button" class="empty-btn primary" data-newtab>新建终端</button>
      </div>
    </div>`;
  }

  function renderBanner() {
    const m = currentMachine();
    if (m.online) {
      banner.hidden = true;
      banner.innerHTML = '';
      return;
    }
    banner.hidden = false;
    banner.innerHTML = `<span aria-hidden="true">●</span><span><b>${esc(m.name)}</b> 离线 · 显示上次的画面</span><button type="button" class="banner-btn" data-reconnect>重连</button>`;
  }

  function renderPane(scrollBottom) {
    const m = currentMachine();
    const s = currentSession();
    renderBanner();

    if (!s) {
      pane.innerHTML = emptyHTML(m);
      composerInput.disabled = true;
      sendBtn.disabled = true;
      composerInput.placeholder = !m.online ? '机器离线，无法发送' : '先打开或新建一个会话';
      keysEl.classList.add('disabled');
      return;
    }

    pane.innerHTML = screenHTML(s);
    const canSend = m.online;
    composerInput.disabled = !canSend;
    sendBtn.disabled = !canSend;
    composerInput.placeholder = canSend ? '输入命令，回车发送（原型会把它写进画面）' : '机器离线，无法发送';
    keysEl.classList.toggle('disabled', !canSend);
    if (scrollBottom) {
      requestAnimationFrame(() => { pane.scrollTop = pane.scrollHeight; });
    }
  }

  /* ---------------------------------------------------------------------
     render: dock / stats / machine line
     --------------------------------------------------------------------- */
  function avatarHTML(m, index, compact) {
    const c = machineCounts(m);
    const active = m.id === activeMachineId;
    let badge = '';
    if (!m.online) {
      badge = '';
    } else if (c.error > 0) {
      badge = `<span class="badge bad">${c.error}</span>`;
    } else if (c.waiting > 0) {
      badge = `<span class="badge warn">${c.waiting}</span>`;
    } else if (c.working > 0) {
      badge = '<span class="work-dot" aria-hidden="true"></span>';
    }

    const statusLine = !m.online
      ? '离线 · 显示上次的画面'
      : `${c.waiting ? c.waiting + ' 需要你 · ' : ''}${c.error ? c.error + ' 失败 · ' : ''}${m.sessions.length} 个会话`;
    const tipMeta = `${statusLine}\n${index >= 0 && index < 9 ? `⌘${index + 1} 切换` : '左右方向键浏览'}`;

    return `<button type="button" class="avatar${active ? ' active' : ''}${m.online ? '' : ' offline'}" style="--h:${m.hue}" data-machine="${esc(m.id)}" aria-label="${esc(m.name)}，${esc(statusLine)}" aria-pressed="${active}" data-tip-title="${esc(m.name)}" data-tip-meta="${esc(tipMeta)}">
      ${esc(m.mono)}${badge}
    </button>`;
  }

  function renderDock() {
    const scrollLeft = dock.scrollLeft;
    dock.innerHTML = machines.map((m, i) => avatarHTML(m, i, false)).join('');
    dock.scrollLeft = scrollLeft;
    requestAnimationFrame(() => {
      dockWrap.classList.toggle('overflow', dock.scrollWidth > dock.clientWidth + 2);
      ensureVisible(dock, '.avatar.active');
    });
  }

  function renderFocusDock() {
    const m = currentMachine();
    const c = machineCounts(m);
    const scrollLeft = fdAvatars.scrollLeft;
    fdAvatars.innerHTML = machines.map((m2, i) => avatarHTML(m2, i, true)).join('');
    fdAvatars.scrollLeft = scrollLeft;
    fdCaption.innerHTML = `<span class="online-dot${m.online ? '' : ' off'}" aria-hidden="true"></span><b>${esc(m.name)}</b><span>· ${m.sessions.length} 个会话</span>${c.waiting ? `<span class="wait">· ${c.waiting} 需要你</span>` : ''}${c.error ? `<span class="bad">· ${c.error} 失败</span>` : ''}`;
    const fleet = fleetStats();
    fdStats.innerHTML = FLEET.map(({ kind }) => fstatHTML(kind, fleet[kind])).join('');
    requestAnimationFrame(() => ensureVisible(fdAvatars, '.avatar.active'));
  }

  function ensureVisible(container, selector) {
    const el = container.querySelector(selector);
    if (!el) return;
    const target = el.offsetLeft - (container.clientWidth - el.offsetWidth) / 2;
    const max = Math.max(0, container.scrollWidth - container.clientWidth);
    container.scrollLeft = Math.max(0, Math.min(target, max));
  }

  const FLEET = [
    { kind: 'waiting', label: '需要你' },
    { kind: 'working', label: '进行中' },
    { kind: 'done', label: '完成' },
    { kind: 'error', label: '失败' },
  ];

  function fstatHTML(kind, count) {
    const label = FLEET.find((f) => f.kind === kind).label;
    return `<button type="button" class="fstat ${kind}${count ? '' : ' zero'}" data-stat="${kind}" aria-label="${esc(label)} ${count}，全舰队" data-tip-title="${esc(label)} · ${count}" data-tip-meta="全舰队 · 点击跳到下一条">
      <i class="fdot" aria-hidden="true"></i><b>${count}</b><span>${esc(label)}</span>
    </button>`;
  }

  function renderStats() {
    const fleet = fleetStats();
    statsEl.innerHTML = FLEET.map(({ kind }) => fstatHTML(kind, fleet[kind])).join('') +
      '<span class="fleet-scope">全舰队</span>';
  }

  function renderMachineLine() {
    const m = currentMachine();
    const idx = machineIndex(m.id);
    const status = m.online ? '在线' : '离线';
    machineLine.setAttribute('data-tip-title', m.name);
    machineLine.setAttribute('data-tip-meta', `${status} · ${m.sessions.length} 个会话`);
    machineLine.innerHTML = `<span class="online-dot${m.online ? '' : ' off'}" aria-hidden="true"></span><span class="name">${esc(m.name)}</span><span class="count">· ${m.sessions.length} 个会话</span><span class="spacer"></span>${idx >= 0 && idx < 9 ? `<kbd>⌘${idx + 1}</kbd>` : ''}`;
  }

  /* ---------------------------------------------------------------------
     render: all
     --------------------------------------------------------------------- */
  function renderAll(options = {}) {
    renderSessions();
    renderTabs();
    renderPane(false);
    renderStats();
    renderMachineLine();
    renderDock();
    renderFocusDock();
    if (options.animate) {
      card.classList.remove('swap');
      void card.offsetWidth;
      card.classList.add('swap');
    }
  }

  /* ---------------------------------------------------------------------
     switching / opening / closing
     --------------------------------------------------------------------- */
  function pickSession(m) {
    const order = ['waiting', 'error', 'working', 'idle', 'done'];
    for (const status of order) {
      const found = m.sessions.find((s) => s.status === status);
      if (found) return found;
    }
    return m.sessions[0] || null;
  }

  function switchMachine(id, sessionId, options = {}) {
    const m = findMachine(id);
    if (!m) return;
    const changed = activeMachineId !== id;
    activeMachineId = id;

    if (changed) {
      filterText = '';
      filterInput.value = '';
      filterOpen = false;
      filterBar.hidden = true;
    }

    if (sessionId) {
      openSession(id, sessionId, { noRender: true });
    } else if (!m.visited) {
      m.visited = true;
      const pick = pickSession(m);
      if (pick) openSession(id, pick.id, { noRender: true });
    } else if (!m.active || !m.tabs.includes(m.active)) {
      m.active = m.tabs.length ? m.tabs[m.tabs.length - 1] : null;
    }

    renderAll({ animate: changed });
    if (changed && !options.silent) {
      const c = machineCounts(m);
      if (c.waiting || c.error) {
        // The badge already says it; no toast on a plain switch.
      }
    }
  }

  function openSession(machineId, sessionId, options = {}) {
    const m = findMachine(machineId);
    if (!m) return;
    const s = findSession(m, sessionId);
    if (!s) return;
    if (!m.tabs.includes(sessionId)) m.tabs.push(sessionId);
    m.active = sessionId;
    m.visited = true;
    if (activeMachineId !== machineId) {
      activeMachineId = machineId;
      filterText = '';
      filterInput.value = '';
      filterOpen = false;
      filterBar.hidden = true;
    }
    if (!options.noRender) renderAll({ animate: true });
  }

  function closeTab(machineId, sessionId, options = {}) {
    const m = findMachine(machineId);
    if (!m) return;
    const idx = m.tabs.indexOf(sessionId);
    if (idx < 0) return;
    m.tabs.splice(idx, 1);
    if (m.active === sessionId) {
      m.active = m.tabs[Math.min(idx, m.tabs.length - 1)] || null;
    }
    renderAll({ animate: true });
    if (!closeHintShown) {
      closeHintShown = true;
      showToast('已关闭标签 · 进程仍在机器上运行');
    }
  }

  function closeActiveTab() {
    const m = currentMachine();
    if (!m.active) {
      showToast('没有打开的标签');
      return;
    }
    closeTab(m.id, m.active);
  }

  function newTab() {
    const m = currentMachine();
    if (!m.online) {
      showToast(`${m.name} 离线，无法新建终端`);
      return;
    }
    const n = m.sessions.filter((s) => s.title.startsWith('新终端')).length + 1;
    const id = `n-${Date.now()}`;
    const title = n > 1 ? `新终端 ${n}` : '新终端';
    const session = {
      id,
      title,
      status: 'idle',
      meta: '刚刚',
      screen: [
        D(`Beacon · new shell on ${m.name}`),
        P('~', '', ''),
        C(),
      ],
    };
    m.sessions.unshift(session);
    m.tabs.push(id);
    m.active = id;
    m.visited = true;
    renderAll({ animate: true });
    setTimeout(() => composerInput.focus(), 40);
    showToast(`已在 ${m.name} 新建终端`);
  }

  function jumpTo(kind) {
    const m = currentMachine();
    const cur = m.sessions.findIndex((s) => s.id === m.active);
    // The count is fleet-wide, but the first hop stays on this machine: a row
    // above the one on screen is still the nearest answer.
    for (let off = 1; off <= m.sessions.length; off += 1) {
      const s = m.sessions[(cur + off + m.sessions.length) % m.sessions.length];
      if (s.status === kind) {
        openSession(m.id, s.id);
        showToast(`跳到 ${m.name} · ${s.title}`);
        return;
      }
    }
    const start = machineIndex(m.id);
    for (let mi = 1; mi < machines.length; mi += 1) {
      const next = machines[(start + mi) % machines.length];
      const s = next.sessions.find((x) => x.status === kind);
      if (s) {
        openSession(next.id, s.id);
        showToast(`跳到 ${next.name} · ${s.title}`);
        return;
      }
    }
    showToast(`全舰队没有${STATUS[kind].label}的会话`);
  }

  /* ---------------------------------------------------------------------
     composer / reconnect / add machine
     --------------------------------------------------------------------- */
  function sendCommand() {
    const m = currentMachine();
    const s = currentSession();
    if (!m.online || !s) return;
    const value = composerInput.value.trim();
    if (!value) return;
    const firstPrompt = s.screen.find((line) => line.t === 'prompt');
    const cwd = firstPrompt ? firstPrompt.path : '~';
    s.screen.push(P(cwd, value, firstPrompt ? firstPrompt.branch : ''));
    s.screen.push(D('sent · output is not simulated in this prototype'));
    composerInput.value = '';
    renderPane(true);
  }

  function reconnect() {
    const m = currentMachine();
    if (m.online) return;
    const button = banner.querySelector('[data-reconnect]') || pane.querySelector('[data-reconnect]');
    if (button) {
      button.disabled = true;
      button.textContent = '正在重连…';
    }
    showToast(`正在重连 ${m.name}…`);
    setTimeout(() => {
      m.online = true;
      renderAll({ animate: true });
      showToast(`${m.name} 已重连`);
    }, 1200);
  }

  function monogram(name) {
    const parts = String(name).split(/[^a-zA-Z0-9\u4e00-\u9fa5]+/).filter(Boolean);
    if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
    return String(name).slice(0, 2).toUpperCase();
  }

  function addMachine(raw) {
    const name = String(raw || '').trim() || `new-host-${newMachineSeq}`;
    const id = `new-${Date.now()}`;
    const hues = [18, 92, 142, 198, 248, 292, 332];
    const m = {
      id,
      name,
      mono: monogram(name),
      hue: hues[newMachineSeq % hues.length],
      online: true,
      visited: true,
      tabs: [],
      active: null,
      sessions: [],
    };
    newMachineSeq += 1;
    machines.push(m);
    activeMachineId = id;
    closePopover();
    renderAll({ animate: true });
    setTimeout(() => {
      ensureVisible(dock, '.avatar.active');
      ensureVisible(fdAvatars, '.avatar.active');
    }, 50);
    showToast(`已添加 ${name} · 从空机器开始`);
  }

  /* ---------------------------------------------------------------------
     tooltip
     --------------------------------------------------------------------- */
  let tipAnchor = null;
  function showTip(el) {
    const title = el.getAttribute('data-tip-title');
    if (!title) return;
    const meta = el.getAttribute('data-tip-meta') || '';
    const kbd = el.getAttribute('data-tip-kbd') || '';
    tip.innerHTML = `<div class="tip-title">${esc(title)}</div>${meta ? `<div class="tip-meta">${esc(meta)}</div>` : ''}${kbd ? `<div class="tip-kbd">${esc(kbd)}</div>` : ''}`;
    tip.hidden = false;
    tipAnchor = el;
    positionTip(el);
    requestAnimationFrame(() => tip.classList.add('show'));
  }
  function positionTip(el) {
    if (!el || tip.hidden) return;
    const r = el.getBoundingClientRect();
    const tw = tip.offsetWidth;
    const th = tip.offsetHeight;
    let left = r.left + r.width / 2 - tw / 2;
    let top = r.top - th - 8;
    if (top < 8) top = r.bottom + 8;
    left = Math.max(8, Math.min(left, window.innerWidth - tw - 8));
    top = Math.max(8, Math.min(top, window.innerHeight - th - 8));
    tip.style.left = `${Math.round(left)}px`;
    tip.style.top = `${Math.round(top)}px`;
  }
  function hideTip() {
    tip.classList.remove('show');
    tipAnchor = null;
    setTimeout(() => { if (!tipAnchor) tip.hidden = true; }, 120);
  }

  /* ---------------------------------------------------------------------
     toast
     --------------------------------------------------------------------- */
  function showToast(message) {
    toastEl.textContent = message;
    toastEl.hidden = false;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toastEl.classList.remove('show');
      setTimeout(() => { if (!toastEl.classList.contains('show')) toastEl.hidden = true; }, 180);
    }, 2200);
  }

  /* ---------------------------------------------------------------------
     popover
     --------------------------------------------------------------------- */
  function settingsHTML() {
    return `<div class="pop-head">外观与侧栏</div>
      <div class="pop-row"><span>主题</span><div class="mini-seg">
        <button type="button" data-set-theme="light" class="${theme === 'light' ? 'on' : ''}">浅色</button>
        <button type="button" data-set-theme="dark" class="${theme === 'dark' ? 'on' : ''}">深色</button>
      </div></div>
      <div class="pop-row"><span>侧栏</span><div class="mini-seg">
        <button type="button" data-set-layout="sidebar" class="${focusMode ? '' : 'on'}">显示</button>
        <button type="button" data-set-layout="focus" class="${focusMode ? 'on' : ''}">沉浸</button>
      </div></div>
      <button type="button" class="pop-action" id="popReset">重置演示</button>`;
  }
  function addHTML() {
    return `<div class="pop-head">添加机器</div>
      <p class="pop-note">原型：会直接加一台空机器，用来演示头像溢出。</p>
      <input class="pop-input" id="newMachineName" placeholder="主机名，如 build-node-08" autocomplete="off" spellcheck="false">
      <button type="button" class="pop-primary" id="popAdd">添加</button>`;
  }
  function openPopover(kind) {
    if (popKind === kind) { closePopover(); return; }
    popKind = kind;
    popover.hidden = false;
    popover.className = `popover ${kind === 'settings' ? 'pop-settings' : 'pop-add'}`;
    popover.innerHTML = kind === 'settings' ? settingsHTML() : addHTML();
    if (kind === 'add') {
      setTimeout(() => $('#newMachineName') && $('#newMachineName').focus(), 0);
    }
  }
  function closePopover() {
    popKind = null;
    popover.hidden = true;
    popover.innerHTML = '';
  }

  /* ---------------------------------------------------------------------
     theme / layout
     --------------------------------------------------------------------- */
  function setTheme(next) {
    theme = next === 'dark' ? 'dark' : 'light';
    win.dataset.theme = theme;
    updateControls();
    closePopover();
    hideTip();
  }
  function setLayout(next) {
    focusMode = next === 'focus';
    win.classList.toggle('focus', focusMode);
    sidebar.inert = focusMode;
    focusDock.inert = !focusMode;
    win.dataset.screenLabel = focusMode ? '机器坞 · 沉浸' : '机器坞 · 侧栏';
    updateControls();
    closePopover();
    hideTip();
    setTimeout(() => {
      ensureVisible(dock, '.avatar.active');
      ensureVisible(fdAvatars, '.avatar.active');
    }, 320);
  }
  function updateControls() {
    $$('[data-set-theme]').forEach((button) => {
      button.classList.toggle('on', button.getAttribute('data-set-theme') === theme);
    });
    $$('[data-set-layout]').forEach((button) => {
      const value = button.getAttribute('data-set-layout');
      button.classList.toggle('on', value === (focusMode ? 'focus' : 'sidebar'));
    });
  }

  /* ---------------------------------------------------------------------
     reset
     --------------------------------------------------------------------- */
  function resetDemo() {
    machines = clone(SEED);
    activeMachineId = 'mini';
    filterText = '';
    filterOpen = false;
    focusMode = false;
    theme = 'light';
    newMachineSeq = 1;
    closeHintShown = false;
    win.dataset.theme = 'light';
    win.classList.remove('focus');
    sidebar.inert = false;
    focusDock.inert = true;
    filterBar.hidden = true;
    filterInput.value = '';
    closePopover();
    hideTip();
    updateControls();
    renderAll({ animate: true });
    showToast('已重置演示');
  }

  /* ---------------------------------------------------------------------
     fit to viewport
     --------------------------------------------------------------------- */
  function fit() {
    const stage = $('.stage');
    if (!stage) return;
    const scale = Math.min(1, stage.clientWidth / 1280, stage.clientHeight / 800);
    document.documentElement.style.setProperty('--scale', String(Math.max(0.35, scale)));
  }

  /* ---------------------------------------------------------------------
     events: static
     --------------------------------------------------------------------- */
  $('#newBtn').addEventListener('click', newTab);
  $('#newTabBtn').addEventListener('click', newTab);
  $('#fdAdd').addEventListener('click', (event) => { event.stopPropagation(); openPopover('add'); });
  $('#addMachineBtn').addEventListener('click', (event) => { event.stopPropagation(); openPopover('add'); });
  $('#settingsBtn').addEventListener('click', (event) => { event.stopPropagation(); openPopover('settings'); });
  $('#refreshBtn').addEventListener('click', () => {
    const button = $('#refreshBtn');
    button.style.transform = 'rotate(160deg)';
    button.style.transition = 'transform .35s ease';
    setTimeout(() => { button.style.transform = ''; button.style.transition = ''; }, 380);
    showToast('已刷新机器与会话');
  });
  $('#collapseBtn').addEventListener('click', () => setLayout('focus'));
  $('#focusToggle').addEventListener('click', () => setLayout('sidebar'));
  $('#filterBtn').addEventListener('click', () => toggleFilter());
  $('#resetBtn').addEventListener('click', resetDemo);
  $('#sendBtn').addEventListener('click', sendCommand);
  composerInput.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && !event.shiftKey) {
      event.preventDefault();
      sendCommand();
    }
  });
  keysEl.addEventListener('click', (event) => {
    const key = event.target.closest('[data-key]');
    if (!key) return;
    if (key.dataset.key === 'Ctrl' || key.dataset.key === 'Alt') {
      key.classList.toggle('on');
    }
  });

  function toggleFilter(force) {
    filterOpen = typeof force === 'boolean' ? force : !filterOpen;
    filterBar.hidden = !filterOpen;
    if (filterOpen) {
      filterInput.focus();
    } else {
      filterInput.value = '';
      filterText = '';
      renderSessions();
    }
  }
  filterInput.addEventListener('input', () => {
    filterText = filterInput.value.trim().toLowerCase();
    renderSessions();
  });

  /* ---------------------------------------------------------------------
     events: delegated content
     --------------------------------------------------------------------- */
  sessionsEl.addEventListener('click', (event) => {
    const row = event.target.closest('[data-session]');
    if (!row) return;
    openSession(activeMachineId, row.getAttribute('data-session'));
  });

  tabsEl.addEventListener('click', (event) => {
    const close = event.target.closest('[data-close]');
    if (close) {
      event.stopPropagation();
      closeTab(activeMachineId, close.getAttribute('data-close'));
      return;
    }
    const tab = event.target.closest('[data-tab]');
    if (!tab) return;
    const m = currentMachine();
    if (m.active !== tab.getAttribute('data-tab')) {
      m.active = tab.getAttribute('data-tab');
      renderAll();
    }
  });
  tabsEl.addEventListener('keydown', (event) => {
    const tab = event.target.closest('[data-tab]');
    if (!tab) return;
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      const m = currentMachine();
      m.active = tab.getAttribute('data-tab');
      renderAll();
      return;
    }
    if (event.key === 'Backspace' || event.key === 'Delete') {
      event.preventDefault();
      closeTab(activeMachineId, tab.getAttribute('data-tab'));
      return;
    }
    if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
      event.preventDefault();
      const all = $$('.tab', tabsEl);
      const index = all.indexOf(tab.closest('.tab'));
      const next = all[(index + (event.key === 'ArrowRight' ? 1 : -1) + all.length) % all.length];
      if (next) next.focus();
    }
  });

  function bindDock(container) {
    container.addEventListener('click', (event) => {
      const avatar = event.target.closest('[data-machine]');
      if (avatar) {
        if (suppressClick) return;
        switchMachine(avatar.getAttribute('data-machine'));
        hideTip();
      }
    });
    container.addEventListener('keydown', (event) => {
      if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
      const all = $$('.avatar', container);
      if (!all.length) return;
      const index = all.indexOf(document.activeElement);
      let next = 0;
      if (event.key === 'ArrowRight') next = (index + 1) % all.length;
      if (event.key === 'ArrowLeft') next = (index - 1 + all.length) % all.length;
      if (event.key === 'End') next = all.length - 1;
      all[next].focus();
      event.preventDefault();
    });
    container.addEventListener('wheel', (event) => {
      if (container.scrollWidth <= container.clientWidth) return;
      if (Math.abs(event.deltaY) > Math.abs(event.deltaX)) {
        container.scrollLeft += event.deltaY;
        event.preventDefault();
      }
    }, { passive: false });

    let drag = null;
    container.addEventListener('pointerdown', (event) => {
      if (container.scrollWidth <= container.clientWidth) return;
      if (event.button !== 0) return;
      drag = { x: event.clientX, left: container.scrollLeft, moved: false };
      container.setPointerCapture(event.pointerId);
    });
    container.addEventListener('pointermove', (event) => {
      if (!drag) return;
      const dx = event.clientX - drag.x;
      if (Math.abs(dx) > 4) drag.moved = true;
      container.scrollLeft = drag.left - dx;
    });
    container.addEventListener('pointerup', () => {
      if (!drag) return;
      if (drag.moved) {
        suppressClick = true;
        setTimeout(() => { suppressClick = false; }, 60);
      }
      drag = null;
    });
    container.addEventListener('pointercancel', () => { drag = null; });
  }
  bindDock(dock);
  bindDock(fdAvatars);

  function bindStats(container) {
    container.addEventListener('click', (event) => {
      const stat = event.target.closest('[data-stat]');
      if (stat) jumpTo(stat.getAttribute('data-stat'));
    });
  }
  bindStats(statsEl);
  bindStats(fdStats);

  pane.addEventListener('click', (event) => {
    if (event.target.closest('[data-newtab]')) { newTab(); return; }
    if (event.target.closest('[data-reconnect]')) { reconnect(); return; }
    const open = event.target.closest('[data-opensession]');
    if (open) openSession(activeMachineId, open.getAttribute('data-opensession'));
  });
  banner.addEventListener('click', (event) => {
    if (event.target.closest('[data-reconnect]')) reconnect();
  });

  popover.addEventListener('click', (event) => {
    const themeBtn = event.target.closest('[data-set-theme]');
    if (themeBtn) { setTheme(themeBtn.getAttribute('data-set-theme')); return; }
    const layoutBtn = event.target.closest('[data-set-layout]');
    if (layoutBtn) { setLayout(layoutBtn.getAttribute('data-set-layout')); return; }
    if (event.target.closest('#popReset')) { resetDemo(); return; }
    if (event.target.closest('#popAdd')) {
      const input = $('#newMachineName');
      addMachine(input ? input.value : '');
    }
  });
  popover.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && event.target.id === 'newMachineName') {
      event.preventDefault();
      addMachine(event.target.value);
    }
    if (event.key === 'Escape') closePopover();
  });

  document.addEventListener('click', (event) => {
    const themeBtn = event.target.closest('[data-set-theme]');
    if (themeBtn) { setTheme(themeBtn.getAttribute('data-set-theme')); return; }
    const layoutBtn = event.target.closest('[data-set-layout]');
    if (layoutBtn) { setLayout(layoutBtn.getAttribute('data-set-layout')); return; }
    if (!popKind) return;
    if (event.target.closest('#popover') || event.target.closest('#settingsBtn') || event.target.closest('#addMachineBtn') || event.target.closest('#fdAdd')) return;
    closePopover();
  });

  /* ---------------------------------------------------------------------
     events: tooltip
     --------------------------------------------------------------------- */
  document.addEventListener('pointerover', (event) => {
    const el = event.target.closest('[data-tip-title]');
    if (!el) return;
    if (el.contains(event.relatedTarget)) return;
    showTip(el);
  });
  document.addEventListener('pointerout', (event) => {
    const el = event.target.closest('[data-tip-title]');
    if (!el) return;
    if (el.contains(event.relatedTarget)) return;
    hideTip();
  });
  document.addEventListener('focusin', (event) => {
    const el = event.target.closest('[data-tip-title]');
    if (el && el.matches('.avatar, .stat, .fd-stat')) showTip(el);
  });
  document.addEventListener('focusout', () => hideTip());
  window.addEventListener('scroll', hideTip, true);
  window.addEventListener('resize', () => { fit(); hideTip(); });
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
      hideTip();
      closePopover();
      if (filterOpen) toggleFilter(false);
    }
  });

  /* ---------------------------------------------------------------------
     events: keyboard
     --------------------------------------------------------------------- */
  document.addEventListener('keydown', (event) => {
    const mod = event.metaKey || event.ctrlKey;
    if (mod && /^[1-9]$/.test(event.key)) {
      const m = machines[Number(event.key) - 1];
      if (m) {
        event.preventDefault();
        switchMachine(m.id);
      }
      return;
    }
    if (mod && event.key.toLowerCase() === 'b') {
      event.preventDefault();
      setLayout(focusMode ? 'sidebar' : 'focus');
      return;
    }
    if (mod && event.key.toLowerCase() === 't') {
      event.preventDefault();
      newTab();
      return;
    }
    if (mod && event.key.toLowerCase() === 'w') {
      event.preventDefault();
      closeActiveTab();
      return;
    }
    if (mod && event.key.toLowerCase() === 'j') {
      event.preventDefault();
      jumpTo('waiting');
      return;
    }
    if (mod && event.shiftKey && (event.key === '[' || event.key === ']')) {
      event.preventDefault();
      const dir = event.key === ']' ? 1 : -1;
      const index = machineIndex(activeMachineId);
      const next = machines[(index + dir + machines.length) % machines.length];
      if (next) switchMachine(next.id);
      return;
    }
    if (event.key === 'Escape') {
      if (document.activeElement === filterInput) toggleFilter(false);
    }
  });

  /* ---------------------------------------------------------------------
     init
     --------------------------------------------------------------------- */
  $$('[data-icon]').forEach((el) => {
    const name = el.getAttribute('data-icon');
    if (ICON[name]) el.innerHTML = ICON[name];
  });
  win.dataset.theme = theme;
  win.classList.toggle('focus', focusMode);
  win.dataset.screenLabel = focusMode ? '机器坞 · 沉浸' : '机器坞 · 侧栏';
  sidebar.inert = focusMode;
  focusDock.inert = !focusMode;
  const bootMachine = currentMachine();
  if (!bootMachine.visited) {
    bootMachine.visited = true;
    const pick = pickSession(bootMachine);
    if (pick) openSession(bootMachine.id, pick.id, { noRender: true });
  }
  updateControls();
  renderAll();
  fit();
  requestAnimationFrame(fit);

  // Keep the tooltip pinned to its anchor while the window scales.
  const observer = new ResizeObserver(() => {
    fit();
    if (tipAnchor) positionTip(tipAnchor);
  });
  observer.observe(document.querySelector('.stage'));
})();
</script>



<script>
if (new URLSearchParams(location.search).has('measure')) {
  const rows = [];
  const q = (sel) => {
    const el = document.querySelector(sel);
    if (!el) return;
    const r = el.getBoundingClientRect();
    rows.push({ sel, top: +r.top.toFixed(1), bottom: +r.bottom.toFixed(1), height: +r.height.toFixed(1), left: +r.left.toFixed(1), right: +r.right.toFixed(1) });
  };
  ['.window','.sidebar','.side-top','.sessions','.side-foot','.foot-tools','.stats','.machine-line','.dock-wrap','.dock','.avatar','.main','.card','.pane','.composer','.keys'].forEach(q);
  const pre = document.createElement('pre');
  pre.id = 'MEASURE';
  pre.style.cssText = 'position:fixed;left:0;top:0;z-index:9999;max-height:100%;overflow:auto;background:#fff;color:#000;font:10px monospace;padding:8px';
  pre.textContent = JSON.stringify({ vw: innerWidth, vh: innerHeight, scale: getComputedStyle(document.documentElement).getPropertyValue('--scale'), rows }, null, 1);
  document.body.appendChild(pre);
}
</script>
