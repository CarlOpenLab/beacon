<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#eceef4" />
    <meta name="description" content="Beacon — Terminal sessions from every machine, in one browser tab." />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <title>Beacon</title>
    <style>
      /* The window ground is the wash before the bundle paints it: no white
         flash between the document and the app, and the same colour the
         browser's own chrome is told to wear. */
      html {
        background: #eceef4;
      }
      html[data-theme="dark"] {
        background: #141418;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
